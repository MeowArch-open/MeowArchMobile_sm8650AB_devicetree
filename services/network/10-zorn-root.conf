# zorn: root login over ssh, for debugging the phone from the machine on the
# hotspot or the USB link. sshd reads Include at the top of sshd_config and the
# first setting wins, so this file sorting before 99-archlinux.conf is what makes
# it take effect.
#
# The key in /root/.ssh/authorized_keys is enough on its own -- the default
# prohibit-password already allows it. PermitRootLogin yes additionally allows the
# root password, which is what was asked for; note that the WPA2 passphrase for
# this hotspot is written down in the repo, so anyone in radio range can reach
# this port until that is changed.
PermitRootLogin yes
PubkeyAuthentication yes
PasswordAuthentication yes
